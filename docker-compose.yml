# Shared multi-tenant server holding no service credentials; clients send their
# own in request headers. Variables are documented in README, Docker section.
services:
  odata-mcp:
    build: .
    image: odata-mcp:local
    command: >
      --universal
      --multi-tenant
      --transport=streamable-http
      --http-addr=0.0.0.0:8080
      --allow-all-interfaces
      --allow-plain-http
      --service=${ODATA_SERVICE_URL:?set ODATA_SERVICE_URL to the OData service root}
      --oauth-token-url=${OAUTH_TOKEN_URL:?set OAUTH_TOKEN_URL to the service's token endpoint}
      --hints-file=/app/hints.json
      ${ODATA_MCP_EXTRA_FLAGS:-}
    environment:
      # Passed as a variable, not a flag, because a scope list contains spaces.
      OAUTH_SCOPE: ${OAUTH_SCOPE:-}
    ports:
      - "127.0.0.1:${ODATA_MCP_PORT:-8080}:8080"
    volumes:
      - ${ODATA_HINTS_FILE:-./hints.json}:/app/hints.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
